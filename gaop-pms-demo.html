          <div class="card-footer">
            <button type="button" class="btn btn-outline" onclick="selectBubble(1)">← Schritt 2 ansehen</button>
            <span style="font-size: 0.83rem; color: var(--text-muted);">
              Steuern Sie Prüfung, Rückfrage oder Freigabe unten im Klinik-Simulator
            </span>
          </div>
        `;
      }

      // Fall D: Abgeschlossen -> OP-Freigabe erteilt!
      return `
        <div class="card-header">
          <div>
            <span class="step-kicker">Schritt 3 von 4 · OP-Freigabe</span>
            <h1 class="card-title">OP-Freigabe erteilt</h1>
            <p class="card-subtitle">${escapeHtml(greeting.formalGreeting)}, alle Unterlagen sind vollständig geprüft und freigegeben.</p>
          </div>
          <span class="status-pill" style="background: var(--green-soft); color: var(--green-dark); border: 1px solid var(--green-border);">Abgeschlossen</span>
        </div>

        <div class="card-body">
          <div class="banner banner-success">
            <div class="banner-icon">${STATUS_META["abgeschlossen"].icon}</div>
            <div>
              <strong>Alle Unterlagen wurden erfolgreich geprüft und freigegeben!</strong>
              <div style="margin-top: 4px; font-size: 0.87rem;">
                Ihr Indikationsschreiben sowie die Kostenübernahme liegen vollständig vor. Sie können nun in Schritt 4 Ihren verbindlichen OP-Termin auswählen.
              </div>
            </div>
          </div>
        </div>

        <div class="card-footer">
          <button type="button" class="btn btn-outline" onclick="selectBubble(1)">← Schritt 2 ansehen</button>
          <button type="button" class="btn btn-primary" onclick="selectBubble(3)">
            Weiter zu Schritt 4: OP-Termin auswählen →
          </button>
        </div>
      `;
    }

    function simulateDocUpload(key) {
      const now = new Date();
      const timeStr = now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr";
      state.docs[key].file = state.docs[key].sampleName;
      state.docs[key].uploadedAt = `heute, ${timeStr}`;
      renderStepCard();
      showToast(`Musterdatei „${state.docs[key].sampleName}“ angehängt`);
    }

    function handleRealDocUpload(event, key) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const now = new Date();
      const timeStr = now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr";
      state.docs[key].file = file.name;
      state.docs[key].uploadedAt = `heute, ${timeStr}`;
      renderStepCard();
      showToast(`Datei „${file.name}“ angehängt`);
    }

    function removeDoc(key) {
      state.docs[key].file = null;
      state.docs[key].uploadedAt = null;
      renderStepCard();
    }

    function submitStep3Docs() {
      if (!state.docs.indication.file || !state.docs.coverage.file) {
        showToast("Bitte fügen Sie Indikationsschreiben und Kostenübernahme hinzu (z. B. per Muster-PDF).");
        return;
      }
      const now = new Date();
      state.step3SubmittedAt = now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr";
      state.stepStatuses[2] = "daten übermittelt";
      renderAll();
      showToast("Unterlagen erfolgreich zur Prüfung eingereicht!");
    }

    // ==========================================================================
    // RENDERING: SCHRITT 4 – OP-TERMIN
    // ==========================================================================
    function renderStep4() {
      const status = state.stepStatuses[3];
      const greeting = getGreetingInfo();
      const chosenOp = state.surgeryProposals.find(s => s.id === state.selectedSurgeryId) || state.surgeryProposals[0];

      // Fall A: Noch gesperrt
      if (status === "gesperrt") {
        return `
          <div class="card-header">
            <div>
              <span class="step-kicker">Schritt 4 von 4 · Operation</span>
              <h1 class="card-title">OP-Termin</h1>
              <p class="card-subtitle">Auswahl Ihres Operationstermins &amp; OP-Vorbereitung</p>
            </div>
            <span class="status-pill" style="background: var(--locked-bg); color: var(--locked-primary); border: 1px solid var(--locked-border);">Gesperrt</span>
          </div>
          <div class="card-body">
            <div class="banner banner-locked">
              <div class="banner-icon">${STATUS_META["gesperrt"].icon}</div>
              <div>
                <strong>Dieser Schritt wird nach erfolgreicher OP-Freigabe geöffnet</strong>
                <div style="margin-top: 4px; font-size: 0.86rem;">
                  Sobald Ihre Unterlagen in Schritt 3 geprüft und freigegeben wurden, schalten wir Ihnen hier konkrete OP-Termine frei.
                </div>
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button type="button" class="btn btn-outline" onclick="selectBubble(2)">← Zurück zu Schritt 3</button>
            <span></span>
          </div>
        `;
      }

      // Fall B: Offen / Aktiv -> OP-Terminvorschläge präsentieren
      if (status === "offen/aktiv") {
        return `
          <div class="card-header">
            <div>
              <span class="step-kicker">Schritt 4 von 4 · Operation</span>
              <h1 class="card-title">OP-Terminvorschläge auswählen</h1>
              <p class="card-subtitle">${escapeHtml(greeting.formalGreeting)}, bitte wählen Sie Ihren Wunschtermin für die stationäre Aufnahme und Operation (${escapeHtml(state.procedure)}).</p>
            </div>
            <span class="status-pill" style="background: var(--blue-soft); color: var(--blue-dark); border: 1px solid var(--blue-border);">Offen / Aktiv</span>
          </div>

          <div class="card-body">
            <div class="section-block">
              <h2 class="section-heading">Freie OP-Kapazitäten unseres Operationsteams</h2>
              <p class="section-hint">Die stationäre Aufnahme erfolgt jeweils einen Tag vor dem eigentlichen OP-Tag.</p>

              <div class="grid-3">
                ${state.surgeryProposals.map(op => {
                  const isSel = op.id === state.selectedSurgeryId;
                  return `
                    <button
                      type="button"
                      class="slot-card ${isSel ? "selected" : ""}"
                      onclick="state.selectedSurgeryId='${op.id}'; renderStepCard();"
                    >
                      <span class="slot-badge">${isSel ? "✓ Ausgewählt" : "OP-Terminvorschlag"}</span>
                      <span style="font-size: 0.78rem; color: var(--text-muted); margin-top: 4px;">OP-Datum:</span>
                      <strong style="font-size: 0.98rem; color: var(--text-main);">${escapeHtml(op.surgeryDate)}</strong>
                      <span style="font-size: 0.81rem; color: var(--blue-primary); font-weight: 600;">Aufnahme: ${escapeHtml(op.admissionDate)}</span>
                      <span style="font-size: 0.81rem; color: var(--text-secondary); margin-top: 4px;">${escapeHtml(op.surgeon)}</span>
                      <span style="font-size: 0.78rem; color: var(--text-muted);">${escapeHtml(op.stayDuration)}</span>
                    </button>
                  `;
                }).join("")}
              </div>
            </div>
          </div>

          <div class="card-footer">
            <button type="button" class="btn btn-outline" onclick="selectBubble(2)">← Zurück zu Schritt 3</button>
            <button type="button" class="btn btn-success" onclick="confirmSurgerySlot()">
              OP-Termin verbindlich auswählen ✓
            </button>
          </div>
        `;
      }

      // Fall C: OP-Termin fixiert ("daten übermittelt" = Warten auf OP-Datum) oder "abgeschlossen"
      const isCompleted = status === "abgeschlossen";
      return `
        <div class="card-header">
          <div>
            <span class="step-kicker">Schritt 4 von 4 · Operation</span>
            <h1 class="card-title">${isCompleted ? "Operation erfolgreich durchgeführt" : "Ihr OP-Termin steht fest"}</h1>
            <p class="card-subtitle">${escapeHtml(greeting.formalGreeting)}, alle Vorbereitungen sind im System hinterlegt.</p>
          </div>
          <span class="status-pill" style="background: var(--green-soft); color: var(--green-dark); border: 1px solid var(--green-border);">
            ${STATUS_META[status].label}
          </span>
        </div>

        <div class="card-body">
          <div class="waiting-hero">
            <span class="countdown-chip">
              ${isCompleted ? "✓ Behandlung abgeschlossen" : `⏳ Noch ${chosenOp.daysRemaining} Tage bis zur stationären Aufnahme`}
            </span>
            <h2 style="font-size: 1.24rem; font-weight: 800; color: var(--text-main);">
              ${isCompleted
                ? `Eingriff (${escapeHtml(state.procedure)}) am ${escapeHtml(chosenOp.surgeryDate)} abgeschlossen`
                : `Ihr OP-Termin steht fest – Warten auf Ihr Aufnahmedatum am ${escapeHtml(chosenOp.admissionDate)}`}
            </h2>
            <p style="font-size: 0.91rem; color: var(--text-secondary); margin-top: 6px;">
              <strong>Geplanter OP-Tag:</strong> ${escapeHtml(chosenOp.surgeryDate)} · <strong>Operateur*in:</strong> ${escapeHtml(chosenOp.surgeon)}<br/>
              <strong>Stationärer Aufenthalt:</strong> ${escapeHtml(chosenOp.stayDuration)} · <strong>Ansprache auf Station:</strong> ${escapeHtml(greeting.shortName)} (${escapeHtml(greeting.pronouns)})
            </p>
            ${!isCompleted ? `
              <div style="margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap;">
                <button type="button" class="btn btn-outline btn-sm" onclick="downloadIcsMock('${escapeHtml(chosenOp.surgeryDate)}', 'Stationaere Aufnahme ${escapeHtml(chosenOp.admissionDate)}')">
                  📅 OP-Termin im Kalender speichern (.ics)
                </button>
                <button type="button" class="btn btn-outline btn-sm" onclick="state.stepStatuses[3]='offen/aktiv'; renderAll();">
                  Anderen OP-Termin wählen
                </button>
              </div>
            ` : ""}
          </div>

          <div class="section-block">
            <h3 class="section-heading">Präoperative Meilensteine &amp; Aufnahmecheckliste</h3>
            <p class="section-hint">Diese Schritte begleiten Sie bis zur stationären Aufnahme:</p>
            <div class="summary-table">
              <div class="summary-row">
                <span class="summary-label">14 Tage vor OP</span>
                <span class="summary-value">Präoperatives Anästhesie-Aufklärungsgespräch &amp; aktuelle Blutabnahme</span>
              </div>
              <div class="summary-row">
                <span class="summary-label">7 Tage vor OP</span>
                <span class="summary-value">Ggf. Pausieren blutverdünnender Medikamente nach ärztlicher Rücksprache</span>
              </div>
              <div class="summary-row">
                <span class="summary-label">Am Aufnahmetag</span>
                <span class="summary-value">Personalausweis, Versichertenkarte, Einweisungsschein &amp; bequeme Kleidung mitbringen</span>
              </div>
              <div class="summary-row">
                <span class="summary-label">Direktkontakt OP-Koordination</span>
                <span class="summary-value">Tel. 0341 / 98 76 54-20 · op-koordination@zentrum-chirurgie.de</span>
              </div>
            </div>
          </div>
        </div>

        <div class="card-footer">
          <button type="button" class="btn btn-outline" onclick="selectBubble(2)">← Schritt 3 ansehen</button>
          <button type="button" class="btn btn-primary" onclick="resetDemo()">
            Demo von vorne starten ↻
          </button>
        </div>
      `;
    }

    function confirmSurgerySlot() {
      state.stepStatuses[3] = "daten übermittelt";
      renderAll();
      showToast("OP-Termin verbindlich gebucht!");
    }

    // ==========================================================================
    // RENDERING: KLINIK-BACKOFFICE SIMULATOR (KONTEXTBEZOGEN)
    // ==========================================================================
    function renderSimulator() {
      const dock = document.getElementById("simulatorDock");
      const body = document.getElementById("simulatorBody");
      const toggleText = document.getElementById("simToggleText");

      dock.classList.toggle("collapsed", state.simCollapsed);
      toggleText.textContent = state.simCollapsed ? "Ausklappen ▴" : "Einklappen ▾";

      const s = state.stepStatuses;
      let statusSummary = "";
      let actionButtons = "";

      if (s[0] === "offen/aktiv") {
        statusSummary = "Aktueller Stand: Patient*in füllt in Schritt 1 die Terminanfrage aus.";
        actionButtons = `
          <button type="button" class="btn-sim btn-sim-green" onclick="submitStep1()">
            Patient*in: Schritt 1 jetzt absenden
          </button>
        `;
      } else if (s[0] === "daten übermittelt" && s[1] === "gesperrt") {
        statusSummary = "Aktueller Stand: Terminanfrage eingegangen. Klinik kann nun Terminvorschläge freigeben.";
        actionButtons = `
          <button type="button" class="btn-sim btn-sim-green" onclick="simApproveStep1()">
            Klinik: Anfrage prüfen &amp; Terminvorschläge senden → Schritt 2 öffnen
          </button>
        `;
      } else if (s[1] === "offen/aktiv") {
        statusSummary = "Aktueller Stand: Patient*in wählt in Schritt 2 einen Erstgespräch-Termin aus.";
        actionButtons = `
          <button type="button" class="btn-sim btn-sim-green" onclick="confirmConsultSlot()">
            Patient*in: Ausgewählten Termin bestätigen
          </button>
        `;
      } else if (s[1] === "daten übermittelt" && s[2] === "gesperrt") {
        statusSummary = "Aktueller Stand: Erstgespräch-Termin steht fest (Warten auf Datum).";
        actionButtons = `
          <button type="button" class="btn-sim btn-sim-green" onclick="simCompleteConsult()">
            Klinik: Erstgespräch als stattgefunden markieren → Schritt 3 öffnen
          </button>
        `;
      } else if (s[2] === "offen/aktiv" || s[2] === "rückfragen/offen/aktiv") {
        statusSummary = s[2] === "rückfragen/offen/aktiv"
          ? "Aktueller Stand: Rückfrage der Klinik aktiv – Patient*in lädt fehlende Dokumente nach."
          : "Aktueller Stand: Patient*in lädt Unterlagen für die OP-Freigabe hoch.";
        actionButtons = `
          <button type="button" class="btn-sim btn-sim-green" onclick="simAutoFillAndSubmitDocs()">
            Patient*in: Muster-Unterlagen hochladen &amp; einreichen
          </button>
        `;
      } else if (s[2] === "daten übermittelt") {
        statusSummary = "Aktueller Stand: Unterlagen wurden eingereicht und warten auf Prüfung.";
        actionButtons = `
          <button type="button" class="btn-sim" onclick="simStartReviewStep3()">
            Klinik: Prüfung starten („in prüfung“)
          </button>
          <button type="button" class="btn-sim btn-sim-green" onclick="simApproveStep3()">
            Klinik: Direkt freigeben („abgeschlossen“)
          </button>
        `;
      } else if (s[2] === "in prüfung") {
        statusSummary = "Aktueller Stand: Unterlagen sind „in prüfung“. Wählen Sie das Prüfergebnis:";
        actionButtons = `
          <button type="button" class="btn-sim btn-sim-orange" onclick="simTriggerQueryStep3()">
            Klinik: Rückfrage auslösen („rückfragen/offen/aktiv“)
          </button>
          <button type="button" class="btn-sim btn-sim-green" onclick="simApproveStep3()">
            Klinik: Unterlagen freigeben („abgeschlossen“ → Schritt 4 öffnen)
          </button>
        `;
      } else if (s[3] === "offen/aktiv") {
        statusSummary = "Aktueller Stand: OP-Freigabe erteilt. Patient*in wählt in Schritt 4 den OP-Termin.";
        actionButtons = `
          <button type="button" class="btn-sim btn-sim-green" onclick="confirmSurgerySlot()">
            Patient*in: OP-Termin verbindlich auswählen
          </button>
        `;
      } else if (s[3] === "daten übermittelt") {
        statusSummary = "Aktueller Stand: OP-Termin ist fixiert (Warten auf OP-Datum).";
        actionButtons = `
          <button type="button" class="btn-sim btn-sim-green" onclick="simCompleteSurgery()">
            Klinik: OP erfolgreich abgeschlossen markieren
          </button>
        `;
      } else {
        statusSummary = "Aktueller Stand: Gesamter Behandlungspfad von Anfrage bis OP abgeschlossen.";
        actionButtons = `
          <button type="button" class="btn-sim btn-sim-green" onclick="resetDemo()">
            Demo neu starten
          </button>
        `;
      }

      body.innerHTML = `
        <div style="font-size: 0.84rem; color: #cbd5e1;">${statusSummary}</div>
        <div class="sim-actions">
          ${actionButtons}
          <button type="button" class="btn-sim btn-sim-ghost" onclick="resetDemo()">Demo zurücksetzen</button>
        </div>
      `;
    }

    // Simulator-Aktionen
    function simApproveStep1() {
      state.stepStatuses[0] = "abgeschlossen";
      state.stepStatuses[1] = "offen/aktiv";
      state.viewingStep = 1;
      renderAll();
      showToast("Klinik hat Terminvorschläge für das Erstgespräch freigegeben");
    }

    function simCompleteConsult() {
      state.stepStatuses[1] = "abgeschlossen";
      state.stepStatuses[2] = "offen/aktiv";
      state.viewingStep = 2;
      renderAll();
      showToast("Erstgespräch abgeschlossen · Schritt 3 „OP-Freigabe“ geöffnet");
    }

    function simAutoFillAndSubmitDocs() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr";
      if (!state.docs.indication.file) {
        state.docs.indication.file = state.docs.indication.sampleName;
        state.docs.indication.uploadedAt = `heute, ${timeStr}`;
      }
      if (!state.docs.coverage.file) {
        state.docs.coverage.file = state.docs.coverage.sampleName;
        state.docs.coverage.uploadedAt = `heute, ${timeStr}`;
      }
      if (state.stepStatuses[2] === "rückfragen/offen/aktiv" && !state.docs.other.file) {
        state.docs.other.file = state.docs.other.sampleName;
        state.docs.other.uploadedAt = `heute, ${timeStr}`;
      }
      state.step3SubmittedAt = timeStr;
      state.stepStatuses[2] = "daten übermittelt";
      state.viewingStep = 2;
      renderAll();
      showToast("Unterlagen eingereicht („daten übermittelt“)");
    }

    function simStartReviewStep3() {
      state.stepStatuses[2] = "in prüfung";
      state.viewingStep = 2;
      renderAll();
      showToast("Status geändert auf „in prüfung“");
    }

    function simTriggerQueryStep3() {
      state.clinicQueryText = "Bitte laden Sie noch Seite 2 des psychotherapeutischen Indikationsschreibens mit Unterschrift/Stempel sowie einen aktuellen endokrinologischen Laborbefund unter „Sonstige Unterlagen“ hoch.";
      state.stepStatuses[2] = "rückfragen/offen/aktiv";
      state.viewingStep = 2;
      renderAll();
      showToast("Klinik-Rückfrage ausgelöst („rückfragen/offen/aktiv“)");
    }

    function simApproveStep3() {
      state.stepStatuses[2] = "abgeschlossen";
      state.stepStatuses[3] = "offen/aktiv";
      state.viewingStep = 3;
      renderAll();
      showToast("OP-Freigabe erteilt · Schritt 4 „OP-Termin“ geöffnet");
    }

    function simCompleteSurgery() {
      state.stepStatuses[3] = "abgeschlossen";
      state.viewingStep = 3;
      renderAll();
      showToast("OP erfolgreich abgeschlossen markiert");
    }

    // ==========================================================================
    // GESAMT-RENDERING & HILFSFUNKTIONEN
    // ==========================================================================
    function renderStepCard() {
      const card = document.getElementById("stepCard");
      switch (state.viewingStep) {
        case 0: card.innerHTML = renderStep1(); break;
        case 1: card.innerHTML = renderStep2(); break;
        case 2: card.innerHTML = renderStep3(); break;
        case 3: card.innerHTML = renderStep4(); break;
      }
    }

    function renderAll() {
      updateHeaderGreeting();
      renderBubbles();
      renderStepCard();
      renderSimulator();
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Initialisierung
    renderAll();
  </script>
</body>
</html>
